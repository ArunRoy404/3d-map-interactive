<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRA — The Living Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="d3.min.js"></script>
<script src="topojson-client.min.js"></script>
<style>
  :root{
    --bg:#f9f9f9;
    --ink:#182D09;
    --panel:#FFFBF6;
    --sea:#e2ebed;
    --accent:#AF6348;
    --brass:#c9a24b;
    --muted:#7E7E7E;
    --line:rgba(24, 45, 9, 0.15);
    --line-soft:rgba(24, 45, 9, 0.06);
    --text-primary:#0A0A0A;
    --text-secondary:#2B3D39;
    --parchment:#2B3D39;
    --champagne:#182D09;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg);
    color:var(--text-primary);
    font-family:'Manrope', sans-serif;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .map-explorer{
    position:relative;
    width:92vw; height:82vh;
    max-width:1200px; max-height:750px; min-height:500px;
    background:#FFFBF6;
    border:1px solid #D1D5DB;
    border-radius:6px;
    box-shadow:0 16px 48px rgba(24, 45, 9, 0.06);
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .zoom-controls{
    position:absolute; bottom:24px; right:28px;
    display:flex; flex-direction:column; gap:8px;
    z-index:30;
  }
  .zoom-controls button{
    width:36px; height:36px;
    border-radius:50%;
    background:rgba(255, 251, 246, 0.85);
    border:1px solid #D1D5DB;
    color:var(--ink);
    font-size:18px; font-weight:600;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition:background 220ms ease, border-color 220ms ease, transform 180ms ease;
  }
  .zoom-controls button:hover{
    background:rgba(24, 45, 9, 0.08);
    border-color:var(--ink);
    color:var(--ink);
    transform:scale(1.08);
  }
  .zoom-controls button:active{
    transform:scale(0.95);
  }

  /* ---------- Brand chrome ---------- */
  .brand{
    position:absolute; top:24px; left:28px; z-index:20;
    pointer-events:none;
  }
  .brand .mark{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:25px;
    letter-spacing:0.24em;
    color:var(--ink);
    text-transform:uppercase;
  }
  .brand .tag{
    margin-top:5px;
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-secondary);
  }

  .instructions{
    position:absolute; bottom:24px; left:28px; z-index:20;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.08em;
    color:var(--text-secondary);
    display:flex; align-items:center; gap:10px;
    transition:opacity .5s ease;
  }
  .instructions .dot{
    width:5px; height:5px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent);
    animation:pulse-dot 2.4s ease-in-out infinite;
  }
  @keyframes pulse-dot{ 0%,100%{opacity:.4} 50%{opacity:1} }

  .compass{
    position:absolute; top:24px; right:28px; z-index:20;
    opacity:0.5;
    width:56px; height:56px;
  }
  .compass circle { stroke: var(--accent) !important; }
  .compass path { fill: var(--accent) !important; }
  .compass text { fill: var(--ink) !important; }

  /* ---------- Map ---------- */
  svg#globe{
    width:100%; height:100%;
    display:block;
  }
  .sphere{ fill:url(#seaGradient); }
  .graticule{ fill:none; stroke:var(--line-soft); stroke-width:0.5; }
  .country{
    fill:#f4f3ee;
    stroke:rgba(24, 45, 9, 0.08);
    stroke-width:0.5;
    vector-effect:non-scaling-stroke;
    transition:fill 480ms cubic-bezier(.2,.7,.3,1), stroke 480ms ease;
    cursor:default;
  }
  .country.has-journey{
    fill:#dce7d5;
    stroke:rgba(24, 45, 9, 0.45);
    stroke-width:0.75;
    cursor:pointer;
  }
  .country.hovered{
    fill:url(#brassFill);
    stroke:var(--accent);
    stroke-width:1.2;
  }
  .country.dimmed{ opacity:0.22; }
  .country.locked{ pointer-events:none; }

  .journey-node{
    fill:var(--accent);
    opacity:0.85;
  }
  .journey-node-pulse{
    fill:none;
    stroke:var(--accent);
    stroke-width:1;
    opacity:0.55;
    animation:ping 2.6s ease-out infinite;
    vector-effect:non-scaling-stroke;
  }
  @keyframes ping{
    0%{ transform:scale(1); opacity:.55; }
    75%{ transform:scale(2.6); opacity:0; }
    100%{ transform:scale(2.6); opacity:0; }
  }

  .route-path{
    fill:none;
    stroke:var(--accent);
    stroke-width:1.5;
    stroke-dasharray:3 4;
    stroke-linecap:round;
    vector-effect:non-scaling-stroke;
    opacity:0;
    animation:dash-flow 24s linear infinite;
  }
  @keyframes dash-flow{ to{ stroke-dashoffset:-500; } }

  .checkpoint circle.ring{
    fill:none; stroke:var(--accent); stroke-width:1; vector-effect:non-scaling-stroke;
  }
  .checkpoint circle.core{
    fill:#FEFEFE; stroke:var(--accent); stroke-width:1.8; vector-effect:non-scaling-stroke;
    transition:fill 220ms ease, r 220ms ease;
  }
  .checkpoint{ cursor:pointer; opacity:0; }
  .checkpoint.active circle.core{ fill:var(--accent); }
  .checkpoint text{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    font-weight:500;
    fill:var(--ink);
    letter-spacing:0.06em;
  }

  .map-explorer::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(24, 45, 9, 0.08);
    border-radius: 4px;
    pointer-events: none;
    z-index: 10;
  }

  .pinned-tooltip {
    position: absolute;
    z-index: 15;
    background: rgba(255, 251, 246, 0.95);
    border: 1.2px solid var(--accent);
    border-radius: 4px;
    padding: 14px 18px;
    width: 220px;
    box-shadow: 0 12px 32px rgba(24, 45, 9, 0.07);
    font-family: 'Manrope', sans-serif;
    pointer-events: none;
    opacity: 0;
    transition: opacity 350ms ease, transform 350ms ease;
    transform: translate(-10px, -92%);
  }
  .pinned-tooltip .p-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .pinned-tooltip .p-title {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    margin: 4px 0 6px;
  }
  .pinned-tooltip .p-desc {
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin: 0;
  }

  /* ---------- Tooltip ---------- */
  #tooltip{
    position:fixed; z-index:60; pointer-events:none;
    padding:10px 14px;
    background:rgba(255,251,246,0.95);
    border:1px solid #D1D5DB;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius:2px;
    opacity:0; transform:translate(14px, -50%) translateY(10px);
    transition:opacity 180ms ease, transform 180ms ease;
    max-width:230px;
    box-shadow:0 8px 24px rgba(24, 45, 9, 0.05);
  }
  #tooltip.show{ opacity:1; transform:translate(14px,-50%) translateY(0); }
  #tooltip .t-title{
    font-family:'Fraunces', serif; font-size:15px; color:var(--ink);
    letter-spacing:0.02em;
  }
  #tooltip .t-sub{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px;
    color:var(--accent); letter-spacing:0.08em; text-transform:uppercase;
    margin-top:4px;
  }
  #tooltip .t-desc{
    font-size:11.5px; color:var(--text-secondary); margin-top:6px; line-height:1.5;
  }

  /* ---------- Back control ---------- */
  #backBtn{
    position:absolute; top:24px; left:50%; transform:translateX(-50%) translateY(-8px);
    z-index:30;
    background:rgba(255, 251, 246, 0.9);
    border:1px solid #D1D5DB;
    backdrop-filter: blur(8px);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase;
    padding:10px 20px;
    border-radius:2px;
    cursor:pointer;
    display:flex; align-items:center; gap:10px;
    opacity:0; pointer-events:none;
    transition:opacity 420ms ease, transform 420ms ease, border-color 220ms ease;
  }
  #backBtn.show{ opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  #backBtn:hover{ border-color:var(--accent); color:var(--accent); }
  #backBtn .arrow{ color:var(--accent); font-size:13px; }

  /* ---------- Journey panel ---------- */
  #journeyPanel{
    position:absolute; top:0; right:0; height:100%;
    width:340px;
    background:linear-gradient(180deg, rgba(255,251,246,0.96), rgba(240,237,230,0.99));
    border-left:1px solid #D1D5DB;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transform:translateX(100%);
    transition:transform 620ms cubic-bezier(.2,.8,.2,1);
    z-index:25;
    padding:80px 24px 40px;
    overflow-y:auto;
  }
  #journeyPanel.show{ transform:translateX(0); }
  #journeyPanel .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.16em;
    color:var(--accent); text-transform:uppercase;
  }
  #journeyPanel h2{
    font-family:'Fraunces', serif; font-weight:500; font-size:30px;
    color:var(--ink); margin:8px 0 4px; letter-spacing:0.01em;
  }
  #journeyPanel .country-desc{
    font-size:12.5px; color:var(--text-secondary); line-height:1.7; margin-bottom:30px;
  }
  .stop{
    position:relative;
    padding:0 0 26px 26px;
    border-left:1px solid var(--line);
    margin-left:6px;
  }
  .stop:last-child{ border-left:1px solid transparent; padding-bottom:2px; }
  .stop::before{
    content:'';
    position:absolute; left:-4.5px; top:2px;
    width:8px; height:8px; border-radius:50%;
    background:#FEFEFE; border:1.6px solid var(--accent);
  }
  .stop.hot::before{ background:var(--accent); }
  .stop .stop-coord{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px;
    color:var(--muted); letter-spacing:0.06em;
  }
  .stop .stop-name{
    font-family:'Fraunces', serif; font-size:17px; color:var(--ink);
    margin:3px 0 5px;
  }
  .stop .stop-desc{
    font-size:11.5px; color:var(--text-secondary); line-height:1.6;
  }

  #closePanel{
    position:absolute; top:36px; right:34px;
    background:none; border:none; color:var(--muted);
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.1em;
    cursor:pointer;
  }
  #closePanel:hover{ color:var(--accent); }

  /* ---------- Toast ---------- */
  #toast{
    position:absolute; bottom:90px; left:50%;
    transform:translateX(-50%) translateY(8px);
    background:rgba(255,251,246,0.95);
    border:1px solid #D1D5DB;
    padding:11px 22px;
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.08em;
    color:var(--accent);
    opacity:0; pointer-events:none;
    transition:opacity 320ms ease, transform 320ms ease;
    z-index:50; text-transform:uppercase;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  #loader{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; z-index:100; background:#FFFBF6;
    transition:opacity 600ms ease;
  }
  #loader .ring{
    width:34px; height:34px; border-radius:50%;
    border:2px solid #E5E7EB;
    border-top-color:var(--ink);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loader .ltext{
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.16em;
    color:var(--muted); text-transform:uppercase;
  }

  @media (max-width:720px){
    #journeyPanel{ width:100%; }
    .brand{ top:22px; left:22px; }
    .instructions{ left:22px; bottom:22px; font-size:9.5px; }
    .compass{ display:none; }
  }
</style>
</head>
<body>

<div class="map-explorer">
  <div id="loader">
    <div class="ring"></div>
    <div class="ltext">Charting the Atlas</div>
  </div>

  <div class="brand">
    <div class="mark">M I R A</div>
    <div class="tag">Guide to Extraordinary Places</div>
  </div>

  <div class="instructions" id="instructions">
    <span class="dot"></span> Select a gateway to explore our curated journeys
  </div>

  <svg class="compass" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="30" fill="none" stroke="#c9a24b" stroke-width="0.7"/>
    <circle cx="32" cy="32" r="24" fill="none" stroke="#c9a24b" stroke-width="0.4"/>
    <g class="needle-group" style="transform-origin: 32px 32px; transition: transform 100ms ease-out;">
      <path d="M32 6 L36 32 L32 58 L28 32 Z" fill="#c9a24b" opacity="0.85"/>
      <path d="M6 32 L32 28 L58 32 L32 36 Z" fill="#c9a24b" opacity="0.4"/>
    </g>
    <text x="32" y="14" text-anchor="middle" font-family="IBM Plex Mono" font-size="6" fill="#eadfc9">N</text>
  </svg>

  <div class="stage">
    <svg id="globe" viewBox="0 0 960 620">
      <!-- Dynamic annotation pointer line -->
      <line id="annotationLine" stroke="#AF6348" stroke-width="1.2" stroke-dasharray="2 3" opacity="0"></line>
    </svg>
    
    <!-- Pinned premium annotation tooltip -->
    <div class="pinned-tooltip" id="pinnedTooltip">
      <div class="p-eyebrow">MIRA Gateways</div>
      <h4 class="p-title">Extraordinary Places</h4>
      <p class="p-desc">Curated travel experiences crafted for explorers who seek the extraordinary. Let us take you there.</p>
    </div>

    <div class="zoom-controls">
      <button id="zoomIn" title="Zoom In">+</button>
      <button id="zoomOut" title="Zoom Out">−</button>
    </div>
  </div>

  <button id="backBtn"><span class="arrow">&#8592;</span> Return to the Atlas</button>

  <div id="journeyPanel">
    <button id="closePanel">CLOSE ✕</button>
    <div class="eyebrow" id="panelEyebrow">Curated Voyage</div>
    <h2 id="panelTitle">—</h2>
    <div class="country-desc" id="panelDesc"></div>
    <div id="stopsList"></div>
  </div>

  <div id="toast"></div>
  <div id="tooltip">
    <div class="t-title" id="tt-title"></div>
    <div class="t-sub" id="tt-sub"></div>
    <div class="t-desc" id="tt-desc"></div>
  </div>
</div>

<script>
(function(){

  /* =========================================================
     JOURNEY DATA — curated countries with checkpoints
  ========================================================== */
  const displayNames = {
    "Bosnia and Herz.": "Bosnia & Herzegovina",
    "Macedonia": "North Macedonia"
  };

  const journeys = {
    "Croatia": {
      subtitle: "The Adriatic Pearls",
      desc: "From the walled streets of Dubrovnik to the historic waterfront of Split and the capitals charm.",
      stops: [
        { name:"Zagreb", coords:[15.9780, 45.8150], desc:"The vibrant upper town, stone gates, and bustling markets of the capital." },
        { name:"Split", coords:[16.4402, 43.5081], desc:"Stroll the ancient halls of Diocletian Palace, meeting the Adriatic tide." },
        { name:"Dubrovnik", coords:[18.0944, 42.6507], desc:"Walk the medieval stone walls overlooking the azure sea at sunset." }
      ]
    },
    "Greece": {
      subtitle: "Marble & Aegean Light",
      desc: "From the Acropolis in Athens to the volcanic cliffs and whitewashed lanes of the Cyclades.",
      stops: [
        { name:"Athens", coords:[23.7275, 37.9838], desc:"The Acropolis at first light, then exploring the old Plaka district on foot." },
        { name:"Santorini", coords:[25.4615, 36.3932], desc:"Caldera-view cliffs, private sunsets, and volcanic vineyard tastings." },
        { name:"Mykonos", coords:[25.3289, 37.4467], desc:"Iconic windmills, hidden sandy coves, and dinner above Little Venice." }
      ]
    },
    "Slovenia": {
      subtitle: "Alps to the Adriatic Coast",
      desc: "Emerald alpine waters of Bled, deep caverns of Postojna, and coastal Venetian architecture.",
      stops: [
        { name:"Ljubljana", coords:[14.5058, 46.0569], desc:"Bridges and baroque alleys along the river beneath the castle hill." },
        { name:"Lake Bled", coords:[14.1146, 46.3683], desc:"Row to the island church in a pletna boat, surrounded by snow-capped peaks." },
        { name:"Piran", coords:[13.5684, 45.5276], desc:"Venetian-gothic squares and salt pans on the narrow Adriatic peninsula." }
      ]
    },
    "Bosnia and Herz.": {
      subtitle: "East Meets West",
      desc: "Sarajevo's Ottoman old bazaar, the famous stone arch of Mostar, and refreshing wild waterfalls.",
      stops: [
        { name:"Sarajevo", coords:[18.4131, 43.8563], desc:"Coppersmith alleys, mountain views, and crossroads of cultures." },
        { name:"Mostar", coords:[17.8078, 43.3430], desc:"The rebuilt 16th-century bridge connecting riverbanks of stone." },
        { name:"Kravica", coords:[17.6083, 43.1585], desc:"Emerald cascades and lush forests, a serene natural amphitheater." }
      ]
    },
    "Bulgaria": {
      subtitle: "Valley of Kings & Black Sea Shores",
      desc: "Sofia's grand golden domes, the antique theater of Plovdiv, and coastal Nessebar.",
      stops: [
        { name:"Sofia", coords:[23.3219, 42.6977], desc:"Underground Roman ruins and the massive Alexander Nevsky cathedral." },
        { name:"Plovdiv", coords:[24.7453, 42.1354], desc:"Winding cobbled streets of the old town and the 2nd-century theater." },
        { name:"Nessebar", coords:[27.7182, 42.6589], desc:"An ancient island-town with windmills and Byzantine church ruins." }
      ]
    },
    "Albania": {
      subtitle: "The Albanian Riviera",
      desc: "The Ottoman castle houses of Gjirokastër, ruins of Butrint, and crystal-clear waters.",
      stops: [
        { name:"Tirana", coords:[19.8189, 41.3275], desc:"Vibrant pastel buildings and the historic central Skanderbeg Square." },
        { name:"Gjirokastër", coords:[20.1389, 40.0758], desc:"Stone-roofed fortress houses and the old bazaar steep slopes." },
        { name:"Ksamil", coords:[20.0050, 39.7761], desc:"Crystal beaches and islands, resting along the Ionian sea channel." }
      ]
    },
    "Kosovo": {
      subtitle: "Historic Canyons & Alleys",
      desc: "Vibrant cafes of Pristina, the Ottoman charm of Prizren, and the rugged mountain passes.",
      stops: [
        { name:"Pristina", coords:[21.1655, 42.6629], desc:"Modern energy, vibrant macchiato culture, and the iconic library." },
        { name:"Prizren", coords:[20.7415, 42.2153], desc:"Cross the stone bridge to the old mosques and hilltop fortress." },
        { name:"Peja", coords:[20.2917, 42.6592], desc:"Gateway to the massive, vertical cliffs of Rugova Canyon." }
      ]
    },
    "Macedonia": {
      subtitle: "UNESCO Waters & Stone Bridges",
      desc: "Skopje's neoclassical plazas, the sublime lakeshore of Ohrid, and mountain parks.",
      stops: [
        { name:"Skopje", coords:[21.4314, 41.9965], desc:"The grand stone bridge over the Vardar river and the fortress peak." },
        { name:"Ohrid", coords:[20.8016, 41.1172], desc:"UNESCO ancient churches, narrow lake cliffs, and clear pristine waters." },
        { name:"Mavrovo", coords:[20.7322, 41.7042], desc:"Peaceful mountain peaks and the famous half-submerged lake church." }
      ]
    }
  };

  /* =========================================================
     SETUP
  ========================================================== */
  const svg = d3.select("#globe");
  const width = 960, height = 620;
  const defs = svg.append("defs");

  // Sea/Ocean gradient (light mode)
  const seaGrad = defs.append("radialGradient").attr("id","seaGradient")
    .attr("cx","50%").attr("cy","38%").attr("r","70%");
  seaGrad.append("stop").attr("offset","0%").attr("stop-color","#edf4f6");
  seaGrad.append("stop").attr("offset","100%").attr("stop-color","#d4e4e7");

  // Accented terracotta gradient for country hover fills
  const brassGrad = defs.append("linearGradient").attr("id","brassFill")
    .attr("x1","0%").attr("y1","0%").attr("x2","100%").attr("y2","100%");
  brassGrad.append("stop").attr("offset","0%").attr("stop-color","#c4795c");
  brassGrad.append("stop").attr("offset","100%").attr("stop-color","#AF6348");

  // Shadow under the globe for 3D depth in light mode
  const shadowGrad = defs.append("radialGradient").attr("id","globeShadow")
    .attr("cx","50%").attr("cy","50%").attr("r","50%");
  shadowGrad.append("stop").attr("offset","60%").attr("stop-color","rgba(24,45,9,0.12)");
  shadowGrad.append("stop").attr("offset","100%").attr("stop-color","rgba(24,45,9,0)");

  // Atmos/edge glow gradient for a premium light-mode rim light
  const atmosGrad = defs.append("radialGradient").attr("id","atmosphereGrad")
    .attr("cx","50%").attr("cy","50%").attr("r","50%")
    .attr("fx","40%").attr("fy","40%");
  atmosGrad.append("stop").attr("offset","80%").attr("stop-color","rgba(255,255,255,0.0)");
  atmosGrad.append("stop").attr("offset","96%").attr("stop-color","rgba(255,255,255,0.40)");
  atmosGrad.append("stop").attr("offset","100%").attr("stop-color","rgba(255,255,255,0.85)");

  const glow = defs.append("filter").attr("id","softGlow").attr("x","-60%").attr("y","-60%").attr("width","220%").attr("height","220%");
  glow.append("feGaussianBlur").attr("stdDeviation","3.2").attr("result","blur");
  const merge = glow.append("feMerge");
  merge.append("feMergeNode").attr("in","blur");
  merge.append("feMergeNode").attr("in","SourceGraphic");

  // Orthographic 3D projection (deeply zoomed in on Balkans collection)
  const projection = d3.geoOrthographic()
    .scale(1150)
    .translate([width/2, height/2])
    .rotate([-20, -42, 0])
    .clipAngle(90);

  const path = d3.geoPath(projection);

  const g = svg.append("g").attr("class","map-root");
  const sphereLayer = g.append("g");
  const countryLayer = g.append("g").attr("class","countries-group");
  const journeyLayer = g.append("g").attr("class","journeys-group");

  // Shadow circle for floating effect
  sphereLayer.append("circle")
    .attr("class", "globe-shadow")
    .attr("cx", width/2)
    .attr("cy", height/2 + 1150 * 0.08)
    .attr("r", 1150 * 1.08)
    .style("fill", "url(#globeShadow)")
    .style("pointer-events", "none");

  // Solid sphere background (sea)
  sphereLayer.append("path")
    .datum({type:"Sphere"})
    .attr("class","sphere")
    .attr("d", path);

  // Minimal graticule (every 15 degrees)
  sphereLayer.append("path")
    .datum(d3.geoGraticule().step([15, 15])())
    .attr("class","graticule")
    .attr("d", path);

  // Atmospheric glow overlay
  sphereLayer.append("circle")
    .attr("class", "atmosphere")
    .attr("cx", width/2)
    .attr("cy", height/2)
    .attr("r", 1150)
    .style("fill", "url(#atmosphereGrad)")
    .style("pointer-events", "none");

  const tooltip = d3.select("#tooltip");
  const backBtn = d3.select("#backBtn");
  const panel = d3.select("#journeyPanel");
  const toastEl = d3.select("#toast");
  const instructions = d3.select("#instructions");

  let zoomedCountry = null;
  let currentScale = 1150;
  let timer = null;
  let isDragging = false;

  // Check if a point is visible on the front face of the globe
  function isPointVisible(coords) {
    const rotate = projection.rotate();
    const center = [-rotate[0], -rotate[1]];
    return d3.geoDistance(coords, center) < Math.PI / 2;
  }

  // Update globe projection and redraw all paths/elements
  function updateGlobe() {
    const scale = projection.scale();
    const translate = projection.translate();

    // Redraw geometry paths
    sphereLayer.select(".sphere").attr("d", path);
    sphereLayer.select(".graticule").attr("d", path);
    countryLayer.selectAll("path.country").attr("d", path);

    // Redraw journey lines (curved on sphere)
    journeyLayer.selectAll("path.route-path").attr("d", path);

    // Update checkpoint labels and nodes (hide on back of globe)
    journeyLayer.selectAll("g.checkpoint")
      .attr("transform", d => {
        const pts = projection(d.coords);
        return `translate(${pts[0]},${pts[1]})`;
      })
      .style("display", d => isPointVisible(d.coords) ? null : "none");

    // Scale overlay circles dynamically
    sphereLayer.select(".atmosphere")
      .attr("cx", translate[0])
      .attr("cy", translate[1])
      .attr("r", scale);

    sphereLayer.select(".globe-shadow")
      .attr("cx", translate[0])
      .attr("cy", translate[1] + scale * 0.08)
      .attr("r", scale * 1.08);

    // Rotate compass needle based on current longitude rotation
    const r = projection.rotate();
    d3.select(".needle-group")
      .style("transform", `rotate(${-r[0]}deg)`);

    // Pinned annotation card pointing to the Balkan region
    const pinnedCoords = [20.5, 42.8]; // Balkans center (approx Montenegro/Kosovo)
    if (isPointVisible(pinnedCoords) && !zoomedCountry) {
      const pts = projection(pinnedCoords);
      d3.select("#pinnedTooltip")
        .style("left", (pts[0] + 55) + "px")
        .style("top", (pts[1] - 50) + "px")
        .style("opacity", 1);
      d3.select("#annotationLine")
        .attr("x1", pts[0])
        .attr("y1", pts[1])
        .attr("x2", pts[0] + 45)
        .attr("y2", pts[1] - 45)
        .style("opacity", 0.7);
    } else {
      d3.select("#pinnedTooltip").style("opacity", 0);
      d3.select("#annotationLine").style("opacity", 0);
    }
  }

  // Soft automatic spin animation
  function startSpin() {
    if (timer) timer.stop();
    timer = d3.timer((elapsed) => {
      if (zoomedCountry || isDragging) return;
      const r = projection.rotate();
      projection.rotate([r[0] + 0.12, r[1], r[2]]);
      updateGlobe();
    });
  }

  function stopSpin() {
    if (timer) timer.stop();
  }

  // Setup drag logic with smooth inertia decay (Lenis style)
  let vX = 0, vY = 0;
  let inertiaTimer = null;

  const drag = d3.drag()
    .on("start", function() {
      isDragging = true;
      if (inertiaTimer) inertiaTimer.stop();
      vX = 0;
      vY = 0;
    })
    .on("drag", function(event) {
      if (zoomedCountry) return;
      const r = projection.rotate();
      const k = 75 / projection.scale();
      vX = event.dx * k;
      vY = -event.dy * k;
      projection.rotate([
        r[0] + vX,
        r[1] + vY
      ]);
      updateGlobe();
    })
    .on("end", function() {
      isDragging = false;
      if (inertiaTimer) inertiaTimer.stop();
      
      // Inertial dampening loop
      inertiaTimer = d3.timer(() => {
        if (isDragging || zoomedCountry) {
          inertiaTimer.stop();
          return;
        }
        vX *= 0.93; // friction factor
        vY *= 0.93;
        
        if (Math.abs(vX) < 0.005 && Math.abs(vY) < 0.005) {
          inertiaTimer.stop();
          return;
        }
        const r = projection.rotate();
        projection.rotate([r[0] + vX, r[1] + vY]);
        updateGlobe();
      });
    });

  svg.call(drag);

  function showToast(msg){
    toastEl.text(msg).classed("show", true);
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classed("show", false), 2200);
  }

  function positionTooltip(event, htmlBits){
    tooltip.select("#tt-title").text(htmlBits.title);
    tooltip.select("#tt-sub").text(htmlBits.sub);
    tooltip.select("#tt-desc").text(htmlBits.desc || "");
    tooltip
      .style("left", (event.clientX) + "px")
      .style("top", (event.clientY) + "px")
      .classed("show", true);
  }
  function hideTooltip(){ tooltip.classed("show", false); }

  /* =========================================================
     LOAD WORLD DATA
  ========================================================== */
  d3.json("world.json").then(world => {
    const countries = topojson.feature(world, world.objects.countries).features;

    countryLayer.selectAll("path.country")
      .data(countries)
      .join("path")
      .attr("class", d => "country" + (journeys[d.properties.name] ? " has-journey" : ""))
      .attr("d", path)
      .on("mousemove", function(event, d){
        if (zoomedCountry) return;
        const j = journeys[d.properties.name];
        if (!j) return;
        const dispName = displayNames[d.properties.name] || d.properties.name;
        positionTooltip(event, {
          title: dispName,
          sub: j.stops.length + " checkpoint voyage",
          desc: j.subtitle
        });
      })
      .on("mouseenter", function(event, d){
        if (zoomedCountry) return;
        const j = journeys[d.properties.name];
        if (!j) return;
        d3.select(this).classed("hovered", true).raise();
        // Bring atmosphere to front so it overlays country highlights correctly
        sphereLayer.select(".atmosphere").raise();
        d3.select(this).style("filter","url(#softGlow)");
      })
      .on("mouseleave", function(event, d){
        const j = journeys[d.properties.name];
        if (!j) return;
        d3.select(this).classed("hovered", false).style("filter", null);
        hideTooltip();
      })
      .on("click", function(event, d){
        if (zoomedCountry) return;
        const j = journeys[d.properties.name];
        if (!j) return;
        hideTooltip();
        zoomToCountry(d, j);
      });

    document.getElementById("loader").style.opacity = 0;
    setTimeout(()=> document.getElementById("loader").style.display = "none", 650);
    updateGlobe();
  }).catch(err => {
    document.getElementById("loader").querySelector(".ltext").textContent = "The atlas could not be reached — check your connection";
    console.error(err);
  });

  /* =========================================================
     ZOOM TO COUNTRY + DRAW spherical JOURNEY
  ========================================================== */
  function zoomToCountry(feature, journey){
    zoomedCountry = feature.properties.name;
    stopSpin();

    countryLayer.selectAll("path.country")
      .classed("dimmed", d => d !== feature)
      .classed("locked", true)
      .filter(d => d === feature)
      .classed("hovered", false)
      .style("filter", null);

    const centroid = d3.geoCentroid(feature);
    const bounds = d3.geoBounds(feature);
    const dLon = Math.abs(bounds[1][0] - bounds[0][0]);
    const dLat = Math.abs(bounds[1][1] - bounds[0][1]);
    const maxAngle = Math.max(dLon, dLat, 6);
    
    // Dynamically calculate fitting scale based on country size (extra deeply zoomed in)
    const targetScale = Math.max(2200, Math.min(4200, 180 / maxAngle * 110));
    
    const r0 = projection.rotate();
    const c0 = [-r0[0], -r0[1]];
    const c1 = centroid;
    
    const s0 = projection.scale();
    const s1 = targetScale;

    const t0 = projection.translate();
    // Offset the center coordinate to the left to compensate for sidebar panel width
    const t1 = [(width - 340)/2 + 15, height/2];

    const interpolateCenter = d3.geoInterpolate(c0, c1);
    const interpolateScale = d3.interpolate(s0, s1);
    const interpolateTranslate = d3.interpolate(t0, t1);

    d3.transition()
      .duration(1400)
      .ease(d3.easeCubicInOut)
      .tween("render", () => {
        return (t) => {
          const center = interpolateCenter(t);
          projection.rotate([-center[0], -center[1], 0]);
          projection.scale(interpolateScale(t));
          projection.translate(interpolateTranslate(t));
          updateGlobe();
        };
      })
      .end()
      .then(() => {
        drawJourney(journey, s1);
        openPanel(feature.properties.name, journey);
      })
      .catch(() => {});

    backBtn.classed("show", true);
    instructions.style("opacity", 0);
  }

  function drawJourney(journey, scale){
    journeyLayer.selectAll("*").remove();

    // Generate curved points between each consecutive stop (flight path style curve)
    const stops = journey.stops;
    const curvedCoords = [];

    for (let i = 0; i < stops.length - 1; i++) {
      const A = stops[i].coords;
      const B = stops[i+1].coords;
      const interpolate = d3.geoInterpolate(A, B);

      const dLon = B[0] - A[0];
      const dLat = B[1] - A[1];
      const len = Math.sqrt(dLon * dLon + dLat * dLat);
      const offsetScale = Math.min(1.8, len * 0.05); // flatter premium offset to keep routes within country limits
      // Perpendicular vector for curved arc
      const perp = len > 0 ? [-dLat / len, dLon / len] : [0, 0];

      const segments = 25;
      for (let j = 0; j <= segments; j++) {
        // Skip adding the starting point if it's not the first segment to avoid duplicates
        if (j === 0 && i > 0) continue;
        const t = j / segments;
        const base = interpolate(t);
        const bend = Math.sin(t * Math.PI) * offsetScale;
        curvedCoords.push([
          base[0] + perp[0] * bend,
          base[1] + perp[1] * bend
        ]);
      }
    }

    const routeFeature = {
      type: "Feature",
      geometry: {
        type: "LineString",
        coordinates: curvedCoords
      }
    };

    // Draw curved spherical path
    journeyLayer.append("path")
      .datum(routeFeature)
      .attr("class","route-path")
      .attr("d", path)
      .style("opacity", 0);

    const nodes = journeyLayer.selectAll("g.checkpoint")
      .data(journey.stops)
      .join("g")
      .attr("class","checkpoint")
      .attr("transform", d => {
        const pts = projection(d.coords);
        return `translate(${pts[0]},${pts[1]})`;
      })
      .style("display", d => isPointVisible(d.coords) ? null : "none")
      .style("opacity", 0);

    const r = 5.5;
    const rOuter = 11;

    nodes.append("circle").attr("class","journey-node-pulse").attr("r", rOuter);
    nodes.append("circle").attr("class","ring").attr("r", rOuter * 0.7);
    nodes.append("circle").attr("class","core").attr("r", r);

    nodes.append("text")
      .attr("x", 0).attr("y", -16)
      .attr("text-anchor","middle")
      .style("font-size", "10px")
      .text((d,i) => "0" + (i+1));

    nodes
      .on("mousemove", function(event, d){
        positionTooltip(event, {
          title: d.name,
          sub: Math.abs(d.coords[1]).toFixed(2) + "° " + (d.coords[1] >= 0 ? "N" : "S") + ", " + 
               Math.abs(d.coords[0]).toFixed(2) + "° " + (d.coords[0] >= 0 ? "E" : "W"),
          desc: d.desc
        });
      })
      .on("mouseenter", function(event, d, i){
        d3.select(this).classed("active", true).select("circle.core")
          .transition().duration(180).attr("r", r * 1.8);
        highlightStop(d.name, true);
      })
      .on("mouseleave", function(event, d){
        d3.select(this).classed("active", false).select("circle.core")
          .transition().duration(180).attr("r", r);
        hideTooltip();
        highlightStop(d.name, false);
      });

    // Fade in path and checkpoints
    journeyLayer.selectAll(".route-path, .checkpoint")
      .transition().duration(800)
      .style("opacity", 1);
  }

  function highlightStop(name, on){
    d3.selectAll(".stop").classed("hot", function(){
      return d3.select(this).attr("data-name") === name && on;
    });
  }

  /* =========================================================
     JOURNEY PANEL
  ========================================================== */
  function openPanel(countryName, journey){
    const dispName = displayNames[countryName] || countryName;
    d3.select("#panelEyebrow").text(dispName + " — Curated Voyage");
    d3.select("#panelTitle").text(journey.subtitle);
    d3.select("#panelDesc").text(journey.desc);

    const list = d3.select("#stopsList");
    list.selectAll("*").remove();
    const stops = list.selectAll(".stop").data(journey.stops).join("div")
      .attr("class","stop")
      .attr("data-name", d => d.name);

    stops.append("div").attr("class","stop-coord")
      .text(d => Math.abs(d.coords[1]).toFixed(2) + "° " + (d.coords[1] >= 0 ? "N" : "S") + ", " + 
                 Math.abs(d.coords[0]).toFixed(2) + "° " + (d.coords[0] >= 0 ? "E" : "W"));
    stops.append("div").attr("class","stop-name").text(d => d.name);
    stops.append("div").attr("class","stop-desc").text(d => d.desc);

    // Sidebar hover/click syncing with map
    stops
      .on("mouseenter", function(event, d) {
        d3.select(this).classed("hot", true);
        
        // Highlight the node on the globe
        d3.selectAll("g.checkpoint")
          .filter(node => node.name === d.name)
          .classed("active", true)
          .select("circle.core")
          .transition().duration(180)
          .attr("r", 5.5 * 1.8);
      })
      .on("mouseleave", function(event, d) {
        d3.select(this).classed("hot", false);
        
        // Remove highlight from the node on the globe
        d3.selectAll("g.checkpoint")
          .filter(node => node.name === d.name)
          .classed("active", false)
          .select("circle.core")
          .transition().duration(180)
          .attr("r", 5.5);
      })
      .on("click", function(event, d) {
        // Smoothly rotate the globe to center the clicked checkpoint
        const r0 = projection.rotate();
        const c0 = [-r0[0], -r0[1]];
        const c1 = d.coords;
        const interpolateCenter = d3.geoInterpolate(c0, c1);
        
        d3.transition()
          .duration(1000)
          .ease(d3.easeCubicInOut)
          .tween("render", () => {
            return (t) => {
              const center = interpolateCenter(t);
              projection.rotate([-center[0], -center[1], 0]);
              updateGlobe();
            };
          });
      });

    panel.classed("show", true);
  }

  function closeEverything(){
    zoomedCountry = null;
    panel.classed("show", false);
    backBtn.classed("show", false);
    instructions.style("opacity", 1);

    journeyLayer.selectAll(".route-path, .checkpoint")
      .transition().duration(300).style("opacity", 0)
      .end().then(()=> journeyLayer.selectAll("*").remove()).catch(()=>{});

    const r0 = projection.rotate();
    const s0 = projection.scale();
    const s1 = 1150;

    const t0 = projection.translate();
    const t1 = [width/2, height/2];

    const interpolateCenter = d3.geoInterpolate([-r0[0], -r0[1]], [20.5, 42.8]);
    const interpolateScale = d3.interpolate(s0, s1);
    const interpolateTranslate = d3.interpolate(t0, t1);

    d3.transition()
      .duration(1200)
      .ease(d3.easeCubicInOut)
      .tween("render", () => {
        return (t) => {
          const center = interpolateCenter(t);
          projection.rotate([-center[0], -center[1], 0]);
          projection.scale(interpolateScale(t));
          projection.translate(interpolateTranslate(t));
          updateGlobe();
        };
      })
      .end()
      .then(() => {
        countryLayer.selectAll("path.country")
          .classed("dimmed", false)
          .classed("locked", false);
      })
      .catch(() => {});
  }

  d3.select("#backBtn").on("click", closeEverything);
  d3.select("#closePanel").on("click", closeEverything);

  // Manual zoom control listeners
  d3.select("#zoomIn").on("click", () => {
    const s = projection.scale();
    if (s >= 3500) return;
    d3.transition().duration(350).ease(d3.easeCubicOut)
      .tween("scale", () => {
        const i = d3.interpolate(s, s * 1.25);
        return (t) => {
          projection.scale(i(t));
          updateGlobe();
        };
      });
  });

  d3.select("#zoomOut").on("click", () => {
    const s = projection.scale();
    if (s <= 200) return;
    d3.transition().duration(350).ease(d3.easeCubicOut)
      .tween("scale", () => {
        const i = d3.interpolate(s, s / 1.25);
        return (t) => {
          projection.scale(i(t));
          updateGlobe();
        };
      });
  });

  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && zoomedCountry) closeEverything();
  });

})();
</script>
</body>
</html>
